<!-- EFIX · СОДЕРЖАНИЕ СТРАНИЦЫ — один блок T123 «HTML-код», ставится в самый конец страницы.
     Компьютер: панель «Содержание» слева видна сразу с первого экрана и открыта; кнопка «Скрыть» сворачивает её в узкий язычок.
     Телефон: кнопка «Содержание» внизу слева, по нажатию — список разделов.
     Названия пунктов берутся прямо из заголовков на странице — совпадают точь-в-точь.

     Как настроить под другую страницу: в списке SECTIONS — начало заголовка каждого раздела, как он написан на странице.
     Пункт меню получит полный текст этого заголовка. Если список оставить пустым ( SECTIONS:[] ) — разделы соберутся автоматически. -->
<style>
.efn{--t:#FFFDF6;--m:#8B8C88;--gold:#CDA64F;--teal:#65E8CC;--panel:rgba(27,28,37,.94);--line:rgba(255,253,246,.1);font-family:Manrope,Arial,sans-serif;-webkit-font-smoothing:antialiased}
.efn *{box-sizing:border-box;margin:0;padding:0}
.efn button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.efn a{text-decoration:none}
/* компьютер — открытая панель */
.efn .pane{position:fixed;left:16px;top:50%;z-index:9980;width:var(--pw,280px);max-height:calc(100vh - 140px);display:flex;flex-direction:column;border-radius:18px;background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 18px 40px -18px rgba(0,0,0,.75);transform:translateY(-50%);transition:opacity .3s,transform .35s cubic-bezier(.2,.7,.2,1),visibility .3s}
.efn.off .pane,.efn.min .pane{opacity:0;visibility:hidden;transform:translate(-30px,-50%)}
.efn .ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 10px 18px}
.efn .ph b{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--m)}
.efn .hide{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:rgba(255,253,246,.7);border:1px solid var(--line);transition:color .2s,border-color .2s,background .2s}
.efn .hide:hover{color:var(--t);border-color:rgba(205,166,79,.6);background:rgba(205,166,79,.08)}
.efn .hide i{width:7px;height:7px;border-left:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-left:2px}
.efn ol{list-style:none;overflow-y:auto;padding:0 10px 6px;scrollbar-width:thin;scrollbar-color:rgba(255,253,246,.2) transparent}
.efn li a{position:relative;display:block;padding:7px 10px 7px 22px;border-radius:9px;font-size:13.5px;line-height:1.35;font-weight:500;color:rgba(255,253,246,.62);transition:color .2s,background .2s}
.efn li a::before{content:"";position:absolute;left:8px;top:13px;width:6px;height:6px;border-radius:50%;background:rgba(255,253,246,.28);transition:all .25s}
.efn li a:hover{color:var(--t);background:rgba(255,253,246,.05)}
.efn li a.past::before{background:rgba(101,232,204,.6)}
.efn li a.cur{color:var(--t);background:rgba(205,166,79,.1)}
.efn li a.cur::before{top:9px;width:4px;height:14px;left:9px;border-radius:3px;background:var(--gold);box-shadow:0 0 10px rgba(205,166,79,.6)}
.efn .prog{margin:4px 18px 14px;height:3px;border-radius:3px;background:rgba(255,253,246,.1);overflow:hidden;flex:none}
.efn .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),#E9C77C);transition:width .2s}
/* компьютер — свёрнутый язычок */
.efn .tab{position:fixed;left:0;top:50%;z-index:9980;display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 8px 14px 6px;border-radius:0 14px 14px 0;background:var(--panel);border:1px solid var(--line);border-left:0;box-shadow:0 14px 30px -14px rgba(0,0,0,.7);color:var(--t);transform:translate(-110%,-50%);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.efn.min:not(.off) .tab{transform:translate(0,-50%)}
.efn .tab span{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.efn .tab i{width:7px;height:7px;border-right:1.5px solid var(--gold);border-top:1.5px solid var(--gold);transform:rotate(45deg);margin-left:-2px}
.efn .tab:hover{background:#252733}
/* телефон */
.efn .fab{position:fixed;left:14px;bottom:16px;z-index:9980;display:none;align-items:center;gap:10px;height:46px;padding:0 16px 0 8px;border-radius:30px;background:var(--panel);border:1px solid var(--line);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 14px 30px -12px rgba(0,0,0,.7);color:var(--t);font-size:14px;font-weight:600;transition:opacity .3s,transform .3s}
.efn.off .fab{opacity:0;transform:translateY(20px);pointer-events:none}
.efn .fab svg{flex:none;width:30px;height:30px;transform:rotate(-90deg)}
.efn .fab .r1{fill:none;stroke:rgba(255,253,246,.15);stroke-width:3}
.efn .fab .r2{fill:none;stroke:var(--gold);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .2s}
.efn .fab em{font-style:normal;color:var(--m);font-weight:500}
.efn .sheet{position:fixed;left:0;right:0;bottom:0;z-index:9995;max-height:78vh;display:flex;flex-direction:column;padding:10px 12px 20px;border-radius:22px 22px 0 0;background:#1E2029;border-top:1px solid var(--line);box-shadow:0 -20px 50px rgba(0,0,0,.5);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.efn.sheet-open .sheet{transform:none}
.efn .shade{position:fixed;inset:0;z-index:9994;background:rgba(0,0,0,.5);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.efn.sheet-open .shade{opacity:1;visibility:visible}
.efn .grip{width:40px;height:4px;border-radius:4px;background:rgba(255,253,246,.25);margin:0 auto 12px}
.efn .sheet h4{display:flex;justify-content:space-between;align-items:center;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--m);margin:0 6px 8px}
.efn .sheet h4 button{width:34px;height:34px;border-radius:50%;background:rgba(255,253,246,.06);font-size:18px;color:var(--t)}
.efn .sheet ol{padding:0}
.efn .sheet li a{font-size:15.5px;padding:11px 10px 11px 24px;border-bottom:1px solid rgba(255,253,246,.06);border-radius:0;color:rgba(255,253,246,.82)}
.efn .sheet li a::before{top:18px}
.efn .sheet li a.cur{border-radius:10px;color:var(--gold)}
.efn .sheet li a.cur::before{top:14px}
@media (max-width:1199px){.efn .pane,.efn .tab{display:none}.efn .fab{display:flex}}
@media (prefers-reduced-motion:reduce){.efn *{transition:none!important}}
</style>

<div class="efn" id="efn">
  <nav class="pane" aria-label="Содержание страницы">
    <div class="ph"><b>Содержание</b><button class="hide" type="button" aria-label="Скрыть содержание"><i></i>Скрыть</button></div>
    <ol></ol>
    <div class="prog"><i></i></div>
  </nav>
  <button class="tab" type="button" aria-label="Показать содержание"><i></i><span>Содержание</span></button>
  <button class="fab" type="button" aria-label="Содержание страницы"><svg viewBox="0 0 36 36"><circle class="r1" cx="18" cy="18" r="15"/><circle class="r2" cx="18" cy="18" r="15" stroke-dasharray="94.25" stroke-dashoffset="94.25"/></svg>Содержание <em class="cnt"></em></button>
  <div class="shade"></div>
  <div class="sheet" role="dialog" aria-label="Содержание"><div class="grip"></div><h4>Содержание <button type="button" aria-label="Закрыть">×</button></h4><ol></ol></div>
</div>

<script>
(function(){
  /* Начало заголовка каждого раздела — как он написан на странице (порядок не важен, пункты встанут по порядку страницы). */
  var SECTIONS=[
    'Почему стоит выбрать FZ Аджман',
    'Пакеты и стоимость в FZ Аджман',
    'Юридические структуры в FZ Аджман',
    'Как мы регистрируем вашу компанию',
    'Подходит ли свободная экономическая зона Аджман',
    'Документы, которые вам понадобятся',
    'Варианты офисов и складов',
    'Налоговые условия для компаний в FZ Аджман',
    'Продление лицензии, внесение изменений и закрытие компании',
    'Почему стоит выбрать EFIX GRP',
    'Что говорят наши клиенты',
    ['Получите бесплатно консультацию сегодня','Получите бесплатн','Получите'],   /* заголовок из нескольких кусков: [как показывать, где искать 1, где искать 2…] */
    'Часто задаваемые вопросы'
  ];
  /* Панель на компьютере при входе:
     'auto' — открыта, если помещается сбоку и не закрывает текст (экраны от ~1760px, напр. 1920);
              на ноутбуках (1366–1700) сразу видна свёрнутая вкладка «Содержание», раскрывается по клику;
     true   — открыта всегда (на ноутбуках будет перекрывать левый край блоков);
     false  — всегда свёрнута. */
  var START_OPEN='auto';
  var GRID=1200;   /* ширина сетки Zero-блоков Тильды */

  var root=document.getElementById('efn');if(!root||root.dataset.init)return;root.dataset.init=1;
  document.body.appendChild(root);
  var norm=function(t){return (t||'').replace(/\s+/g,' ').trim();};
  var low=function(t){return norm(t).toLowerCase();};
  /* только видимые заголовки (скрытые SEO-тексты за краем экрана пропускаем) */
  function atoms(){return [].slice.call(document.querySelectorAll('.t-rec .tn-elem[data-elem-type="text"] .tn-atom, .t-rec h1, .t-rec h2, .t-rec h3')).filter(function(a){if(!a.offsetHeight||root.contains(a))return false;var r=a.getBoundingClientRect();return r.right>0&&r.left<innerWidth;});}
  function find(q){q=low(q);var all=atoms(),i;for(i=0;i<all.length;i++){if(low(all[i].textContent)===q)return all[i];}for(i=0;i<all.length;i++){if(low(all[i].textContent).indexOf(q)===0)return all[i];}return null;}
  function auto(){var out=[];document.querySelectorAll('.t-rec').forEach(function(r){if(!r.offsetHeight)return;var h=null;r.querySelectorAll('.tn-elem[data-elem-type="text"] .tn-atom, h2').forEach(function(a){if(h||!a.offsetHeight)return;var c=getComputedStyle(a);if(parseFloat(c.fontSize)>=20&&+c.fontWeight>=600&&norm(a.textContent).length>3)h=a;});if(h)out.push(h);});return out.slice(1).map(function(h){return {t:norm(h.textContent),el:h};});}

  var list=[],links=[];
  function build(){
    if(SECTIONS.length){list=SECTIONS.map(function(s){
        if(typeof s==='string'){var e=find(s);return e?{t:norm(e.textContent),el:e}:null;}
        for(var i=1;i<s.length;i++){var el=find(s[i]);if(el){var tx=norm(el.textContent);return {t:tx.length>=s[i].length+8?tx:s[0],el:el};}}
        return null;}).filter(Boolean);}
    else list=auto();
    list.sort(function(a,b){return top(a.el)-top(b.el);});
    if(list.length<2){root.style.display='none';return false;}
    links=[];
    root.querySelectorAll('ol').forEach(function(ol){ol.innerHTML='';list.forEach(function(x){var li=document.createElement('li'),a=document.createElement('a');a.href='#';a.textContent=x.t;a.addEventListener('click',function(e){e.preventDefault();go(x);closeSheet();});li.appendChild(a);ol.appendChild(li);links.push(a);});});
    return true;}
  function top(el){return el.getBoundingClientRect().top+scrollY;}
  function hdr(){var el=document.elementFromPoint(innerWidth/2,4),v=0;while(el&&el!==document.body){var p=getComputedStyle(el).position;if(p==='fixed'||p==='sticky'){v=el.getBoundingClientRect().bottom;break;}el=el.parentElement;}return Math.max(0,v);}
  function go(x){scrollTo({top:Math.max(0,top(x.el)-hdr()-40),behavior:'smooth'});}

  /* свернуть / развернуть (запоминается на время визита) */
  function store(v){try{if(v==null)return sessionStorage.getItem('efn-min');sessionStorage.setItem('efn-min',v);}catch(e){return null;}}
  function fits(){return (innerWidth-GRID)/2>=250;}
  function fit(){var m=(innerWidth-GRID)/2;root.style.setProperty('--pw',Math.max(230,Math.min(280,Math.round(m-32)))+'px');}
  fit();addEventListener('resize',fit);
  var saved=store();if(saved==='1'||(saved==null&&(START_OPEN===false||(START_OPEN==='auto'&&!fits()))))root.classList.add('min');
  root.querySelector('.hide').addEventListener('click',function(){root.classList.add('min');store('1');});
  root.querySelector('.tab').addEventListener('click',function(){root.classList.remove('min');store('0');});

  /* телефон */
  var cnt=root.querySelector('.cnt'),ring=root.querySelector('.r2'),bar=root.querySelector('.prog i');
  function openSheet(){root.classList.add('sheet-open');var c=root.querySelector('.sheet a.cur');if(c)c.scrollIntoView({block:'center'});}
  function closeSheet(){root.classList.remove('sheet-open');}
  root.querySelector('.fab').addEventListener('click',openSheet);root.querySelector('.shade').addEventListener('click',closeSheet);root.querySelector('.sheet h4 button').addEventListener('click',closeSheet);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet();});

  /* подсветка текущего раздела; панель видна с первого экрана и прячется только у подвала */
  var tick=false;
  function spy(){tick=false;if(!list.length)return;
    var line=innerHeight*.35,cur=-1;list.forEach(function(x,i){if(x.el.getBoundingClientRect().top<=line)cur=i;});
    var lastRec=list[list.length-1].el.closest('.t-rec')||list[list.length-1].el;
    root.classList.toggle('off',lastRec.getBoundingClientRect().bottom<innerHeight*.35);
    var n=list.length;links.forEach(function(a,i){var k=i%n;a.classList.toggle('cur',k===cur);a.classList.toggle('past',k<cur);});
    var p=cur<0?0:(cur+1)/n;bar.style.width=(p*100)+'%';ring.style.strokeDashoffset=94.25*(1-p);cnt.textContent=(cur<0?0:cur+1)+'/'+n;
    var pane=root.querySelector('.pane ol'),a=pane&&pane.querySelector('a.cur');if(a&&!root.classList.contains('min')){var r=a.offsetTop-pane.offsetTop;if(r<pane.scrollTop||r>pane.scrollTop+pane.clientHeight-40)pane.scrollTop=r-60;}}
  function onS(){if(!tick){tick=true;(window.requestAnimationFrame||setTimeout)(spy);}}
  function init(){if(!build())return;spy();addEventListener('scroll',onS,{passive:true});addEventListener('resize',function(){onS();});setTimeout(function(){list.sort(function(a,b){return top(a.el)-top(b.el);});spy();},1500);}
  if(document.readyState==='complete')setTimeout(init,300);else addEventListener('load',function(){setTimeout(init,300);});
})();
</script>
